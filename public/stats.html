<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantasyLoL - Pro Player Stats</title>

    <!-- Bootstrap 5 CSS CDN (base framework) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared custom dark theme (must load after Bootstrap) -->
    <link href="/css/styles.css" rel="stylesheet">

    <!-- Shared header/footer loader -->
    <script src="/js/layout.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">

    <div data-include="header"></div>

    <main class="container py-4">
        <h1 class="mb-1">Ingested Pro Player Stats</h1>
        <p class="text-muted">Displaying recent pro player performances imported from Leaguepedia.</p>

        <div class="table-responsive">
            <table class="stats-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Player</th>
                        <th>Team</th>
                        <th>Role</th>
                        <th>Region</th>
                        <th>K / D / A</th>
                        <th>CS</th>
                        <th>Result</th>
                        <th>Fantasy Points</th>
                    </tr>
                </thead>
                <tbody id="stats-body">
                    <tr>
                        <td colspan="9" class="state-cell">Loading stats...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div data-include="footer"></div>

    <!-- Bootstrap 5 JS bundle (needed for collapsible navbar) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return isNaN(date.getTime()) ? dateStr : date.toLocaleDateString();
        }

        async function fetchStats() {
            const tbody = document.getElementById('stats-body');
            try {
                const response = await fetch('/api/stats');
                if (!response.ok) throw new Error('Failed to fetch stats');

                const stats = await response.json();

                if (!stats || stats.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="9" class="state-cell">
                                No match stats ingested yet. Trigger an update via <code>POST /admin/stats/update</code>.
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = stats.map(s => {
                    // Player pictures temporarily disabled (no images imported yet).
                    // Re-enable by uncommenting this line and the <img> in the player cell below.
                    // const avatarSrc = s.image_url || 'https://via.placeholder.com/32?text=?';
                    const formattedDate = formatDate(s.match_date);
                    const fp = typeof s.fantasy_points === 'number' ? s.fantasy_points.toFixed(2) : '0.00';

                    let resultBadge = '<span class="badge-none">-</span>';
                    if (s.match_date) {
                        resultBadge = s.win === 1
                            ? '<span class="badge-win">WIN</span>'
                            : '<span class="badge-loss">LOSS</span>';
                    }

                    return `
                        <tr>
                            <td>${formattedDate}</td>
                            <td>
                                <div class="player-cell">
                                    <!-- Player picture temporarily disabled (no images imported yet).
                                         Re-enable together with the avatarSrc line above:
                                    <img src="\${avatarSrc}" alt="\${s.handle}" class="player-avatar" onerror="this.src='https://via.placeholder.com/32?text=?';">
                                    -->
                                    <strong>${s.handle}</strong>
                                </div>
                            </td>
                            <td>${s.pro_team || 'N/A'}</td>
                            <td>${s.role || 'N/A'}</td>
                            <td>${s.region || 'N/A'}</td>
                            <td>${s.kills} / ${s.deaths} / ${s.assists}</td>
                            <td>${s.creep_score}</td>
                            <td>${resultBadge}</td>
                            <td class="fp-col">${fp}</td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="state-cell is-error">
                            Error loading player statistics.
                        </td>
                    </tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchStats);
    </script>
</body>
</html>
